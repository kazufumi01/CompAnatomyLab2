# Mac (.pkg / .zip) と Windows (.exe / .zip) をクラウドでビルドし、GitHub Releases へ自動アップロードする
# - v0.2.2 のようなタグを push → Mac / Windows 両方をビルドして自動で Release を作成・添付
# - 「Actions」タブから手動実行 → release_tag を入れれば既存 Release に添付（空ならテストビルドのみ）
name: Release Build & Upload

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '既存Releaseに添付する場合のタグ（例 v0.2.2）。空ならテストビルドのみ'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VER=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            T="${{ inputs.release_tag }}"
            echo "VER=${T#v}" >> $GITHUB_ENV
          else
            echo "VER=0.0.0-dev" >> $GITHUB_ENV
          fi
      - name: Configure
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCA_COPY=OFF
      - name: Build
        run: cmake --build build --config Release -j3
      - name: Validate AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/CompAnatomyLab2_artefacts/Release/AU/Compressor Anatomy Lab 2.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Cmp2 Jpkl | tail -5
      - name: Package
        run: |
          zsh packaging/mac/build_pkg.sh "$VER"
          zsh packaging/mac/build_zip.sh "$VER"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/*.pkg
            dist/*.zip

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
            echo "VER=${V%%-*}" >> $GITHUB_ENV
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            T="${{ inputs.release_tag }}"
            V="${T#v}"
            echo "VER=${V%%-*}" >> $GITHUB_ENV
          else
            echo "VER=0.0.0-dev" >> $GITHUB_ENV
          fi
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCA_COPY=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Package (installer)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VER" packaging\win\installer.iss
      - name: Package (manual zip)
        shell: pwsh
        run: |
          $art = "build\CompAnatomyLab2_artefacts\Release"
          $dir = "build\zip\CompAnatomyLab2-$env:VER-win64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item -Recurse "$art\VST3\Compressor Anatomy Lab 2.vst3" $dir
          Copy-Item "$art\Standalone\Compressor Anatomy Lab 2.exe" $dir
          Copy-Item "packaging\win\license-win.txt" "$dir\license.txt"
          Copy-Item "packaging\manual\README-win.txt" "$dir\HOW_TO_INSTALL.txt"
          Compress-Archive -Path $dir -DestinationPath "dist\CompAnatomyLab2-$env:VER-win64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false

  # 手動実行で release_tag を指定した時：既存Releaseにファイルを追加・差し替え
  attach:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "${{ github.repository }}"
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes -R "${{ github.repository }}"
          fi
